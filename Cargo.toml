[package]
name = "qwen3-burn"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Qwen3 language model implementation using the Burn deep learning framework"

[features]
default = ["std"]
std = []
wgpu = ["burn/wgpu"]
ndarray = ["burn/ndarray"]
cuda = ["burn/cuda"]
mlx = ["burn-mlx"]
metal = ["burn/metal"]
bench = []
profile = ["tracing-subscriber"]
vision = ["image"]

[[example]]
name = "chat"

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std"] }
safetensors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
rand = "0.10"
half = { version = "2.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
# NOTE: the burn-0.21 port of burn-mlx lives on its `burn-0-21` branch. Until that
# branch is published, the git ref stays on `main` (resolvable) and is redirected to
# the local checkout via the [patch] section below. Flip to `branch = "burn-0-21"`
# and drop the patch once the branch is pushed.
burn-mlx = { git = "https://github.com/eidolons-ai/burn-mlx.git", branch = "main", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[example]]
name = "vision_chat"
required-features = ["vision"]

[[bench]]
name = "ops"
harness = false

# Local development override: build against the local burn-0-21 branch of
# burn-mlx before it is pushed. Remove once the branch is published.
[patch."https://github.com/eidolons-ai/burn-mlx.git"]
burn-mlx = { path = "/Users/mike/Code/burn-mlx" }
